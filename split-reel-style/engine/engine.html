<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<img id="VF" alt=""><img id="PRS" alt="">
<script>
/* ═══ reel engine — محرّك رسم الفريمات (مستقل، جزء من reel-styles) ═══
   صفحة وحدة بتحوّل (فريم فيديو + قناع الشخص + بيانات الكابشن + مشاهد الستايل) لفريم 1080×1920.
   بيتحمّل بعدها ملفات الستايل: split-style.js · paper-style.js · shots.js، وهي بتسجّل مشاهدها بـSCENE_LIST.
   deterministic: الفريم بيعتمد على t فقط (لا Math.random، لا تراكم). */
const C=document.getElementById('cv'), X=C.getContext('2d'), VF=document.getElementById('VF'), PRS=document.getElementById('PRS');
const W=1080, H=1920;
let BG='#0E1116', INK='#111111', ACC='#D97757', CLAY='#C15F3C', MUT='#8A847A', FONT='Rubik';
let CAPS=[], VEND=0, BEHIND=null, PRS_OK=false, SCENES=[];
const SCENE_LIST=[];                       // [[اسم, دالة(t), طبقة?]] — طبقة 'video' بتنرسم قبل الباقي
const R_FULL={x:0,y:0,w:W,h:H,r:0};

/* ── أدوات رسم مشتركة (الستايلات بتعتمد عليها) ── */
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{const c=1.9,s=c+1;return 1+s*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgba(hex,a){const c=hx(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lum(hex){const c=hx(hex).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}

/* ── تهيئة: بيانات الكابشن + الثيم + الخطوط + الصور ── */
function init(d){
  CAPS=d.cards||[]; VEND=d.total||0; BEHIND=d.behind||null;
  const t=d.theme||{};
  BG=t.bg||BG; INK=t.ink||INK; ACC=t.acc||ACC; CLAY=t.clay||CLAY; MUT=t.mut||MUT; FONT=t.font||FONT;
  const loads=[]; for(const w of ['300','400','500','600','700','800','900']){
    loads.push(document.fonts.load(w+' 60px "Rubik"','عربي ـ 123 abc'), document.fonts.load('italic '+w+' 60px "Rubik"','abc 123')); }
  return Promise.all(loads).catch(()=>0).then(()=>document.fonts.ready).then(()=>{
    if(window.SK&&SK.imgsReady) return SK.imgsReady(); }).then(()=>1);
}

/* ── رسم فريم ── */
const _errs=new Set();
function _safe(name,fn,t){ try{ fn(t); }catch(e){ const m='مشهد متخطّى «'+name+'»: '+(e&&e.message); if(!_errs.has(m)){ _errs.add(m); console.error(m); } } }
function draw(t){
  X.setTransform(1,0,0,1,0,0); X.globalAlpha=1; X.globalCompositeOperation='source-over'; X.filter='none'; X.shadowColor='transparent'; X.shadowBlur=0; X.shadowOffsetY=0;
  X.fillStyle=BG; X.fillRect(0,0,W,H);
  const vid=SCENE_LIST.filter(s=>s[2]==='video'), rest=SCENE_LIST.filter(s=>s[2]!=='video');
  if(!vid.length&&VF.naturalWidth) X.drawImage(VF,0,0,W,H);          // بدون ستايل: الفيديو ملء الشاشة
  for(const s of vid){ X.save(); _safe(s[0],s[1],t); X.restore(); }
  for(const s of rest){ X.save(); _safe(s[0],s[1],t); X.restore(); }
}
const _dec=img=>(img.decode?img.decode():Promise.resolve()).catch(()=>0);
window.draw=draw; window.init=init;
window.setFrame=src=>{ VF.src=src; return _dec(VF); };
window.setPerson=src=>{ if(!src){ PRS_OK=false; return Promise.resolve(0); } PRS.src=src; return _dec(PRS).then(()=>{PRS_OK=true;return 1;}); };
window.shot=q=>C.toDataURL('image/jpeg',q);
</script>
<!--STYLE_SCRIPTS-->
</body>
</html>
